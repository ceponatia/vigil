# Local development and CI only. The hosted target (managed Postgres vs. a
# self-run instance, provider, region) is an owner decision not yet made.
services:
  postgres:
    image: postgres:18-alpine
    container_name: vigil-postgres
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil_dev_password
      POSTGRES_DB: vigil_dev
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory under
      # /var/lib/postgresql and refuses to start when a volume sits at the
      # pre-18 path /var/lib/postgresql/data ("unused mount/volume", exit 1).
      - vigil_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vigil_postgres_data:
